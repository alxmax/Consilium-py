  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x: hidden;\n  }\n  ::selection { background: var(--ink); color: var(--paper); }\n  a { color: inherit; text-decoration: none; }\n  code, .mono { font-family: var(--font-mono); font-size: 0.88em; letter-spacing: -0.01em; }\n\n  /* ---- shell ---- */\n  .page { padding-top: 110px; }\n  .container { max-width: var(--content); margin: 0 auto; padding: 0 var(--gutter); }\n  .container--wide { max-width: 1280px; }\n\n  .section { padding: var(--section-pad) 0; border-top: 1px solid var(--rule); }\n  .section--tinted { background: var(--paper-2); }\n  .section--inked { background: var(--ink); color: var(--paper); }\n  .section--inked .h-section, .section--inked .h-sub { color: var(--paper); }\n  .section--inked .lede { color: rgba(244,236,216,0.7); }\n  .section--inked .divider-num { color: rgba(244,236,216,0.55); }\n  .section--inked .divider-num::after { background: rgba(244,236,216,0.18); }\n  .section--inked .card { background: rgba(244,236,216,0.04); border-color: rgba(244,236,216,0.16); }\n  .section--inked .card p { color: rgba(244,236,216,0.72); }\n\n  /* ---- topbar ---- */\n  .topbar {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 60;\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 14px var(--gutter);\n    background: color-mix(in oklch, var(--paper) 92%, transparent);\n    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--rule); font-size: 13px;\n  }\n  .topbar__brand { display: flex; align-items: center; gap: 11px; font-family: var(--font-mono); font-weight: 500; letter-spacing: -0.01em; }\n  .topbar__actions { display: flex; align-items: center; gap: 10px; }\n  .btn-link {\n    display: inline-flex; align-items: center; gap: 8px;\n    font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);\n    border: 1px solid var(--rule-2); border-radius: 2px; padding: 8px 13px;\n    transition: border-color 0.15s, background 0.15s, color 0.15s;\n  }\n  .btn-link:hover { border-color: var(--ink-3); color: var(--ink); background: var(--paper-2); }\n  .btn-link svg { width: 14px; height: 14px; }\n\n  /* ---- numbered nav ---- */\n  .navbar {\n    position: fixed; top: 53px; left: 0; right: 0; z-index: 55;\n    background: color-mix(in oklch, var(--paper) 94%, transparent);\n    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--rule);\n    padding: 9px var(--gutter);\n    display: flex; gap: 5px; flex-wrap: wrap;\n  }\n  .navchip {\n    display: inline-flex; align-items: center; gap: 8px;\n    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;\n    text-transform: uppercase; color: var(--ink-3);\n    border: 1px solid transparent; border-radius: 2px; padding: 5px 10px;\n    cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;\n  }\n  .navchip:hover { background: var(--paper-2); color: var(--ink-2); }\n  .navchip__id { color: var(--signal); font-weight: 500; }\n  .navchip[data-active=\"true\"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }\n  .navchip[data-active=\"true\"] .navchip__id { color: rgba(244,236,216,0.6); }\n  @media (max-width: 720px) { .navbar { flex-wrap: nowrap; overflow-x: auto; } .navchip__name { display: none; } }\n\n  /* ---- type ---- */\n  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 18px; }\n  .h-display { font-family: var(--font-sans); font-size: clamp(40px, 6vw, 78px); line-height: 0.98; letter-spacing: -0.035em; font-weight: 500; margin: 0; text-wrap: balance; }\n  .h-section { font-family: var(--font-sans); font-size: clamp(28px, 3.6vw, 46px); line-height: 1.04; letter-spacing: -0.028em; font-weight: 500; margin: 0 0 16px; text-wrap: balance; color: var(--ink); }\n  .h-sub { font-family: var(--font-sans); font-size: clamp(19px, 2vw, 23px); line-height: 1.28; letter-spacing: -0.015em; font-weight: 600; margin: 0 0 10px; color: var(--ink); }\n  .lede { font-size: clamp(19px, 1.8vw, 22px); line-height: 1.45; color: var(--ink-2); max-width: 760px; text-wrap: pretty; margin: 0 0 32px; }\n  .prose { max-width: 720px; }\n  .prose p { margin: 0 0 16px; color: var(--ink-2); text-wrap: pretty; }\n  .prose strong { color: var(--ink); font-weight: 600; }\n  .signal { color: var(--signal); }\n\n  /* ---- divider num ---- */\n  .divider-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-bottom: 30px; display: flex; align-items: center; gap: 14px; letter-spacing: 0.08em; text-transform: uppercase; }\n  .divider-num::before { content: \"[\"; color: var(--signal); }\n  .divider-num__id { color: var(--signal); font-weight: 500; }\n  .divider-num::after { content: \"\"; flex: 1; height: 1px; background: var(--rule); }\n\n  /* ---- hero ---- */\n  .hero { padding: clamp(48px, 9vw, 120px) 0 var(--section-pad); }\n  .hero__meta { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 30px; }\n  .hero__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--signal); }\n  .hero .lede { margin-top: 32px; font-size: clamp(20px, 2vw, 25px); max-width: 800px; }\n  .hero__cmd {\n    margin-top: 40px; display: inline-flex; align-items: center; gap: 0;\n    font-family: var(--font-mono); font-size: clamp(14px, 1.5vw, 18px);\n    background: var(--ink); color: var(--paper); border-radius: 3px; padding: 16px 22px;\n  }\n  .hero__cmd .pr { color: rgba(244,236,216,0.45); margin-right: 12px; }\n  .hero__cmd .str { color: #e0a878; }\n\n  /* ---- layout helpers ---- */\n  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }\n  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }\n  .split { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 48px; align-items: center; }\n  .split--code { grid-template-columns: 1.1fr 0.9fr; }\n  .mt-48 { margin-top: 48px; }\n  .mt-40 { margin-top: 40px; }\n  @media (max-width: 860px) { .grid-2, .grid-3, .split, .split--code { grid-template-columns: 1fr; gap: 24px; } }\n\n  /* ---- cards ---- */\n  .card { border: 1px solid var(--rule); background: var(--paper); border-radius: 4px; padding: 28px; }\n  .card--flat { background: transparent; }\n  .card h3 { font-family: var(--font-sans); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; margin: 0; }\n  .card p { font-size: 16px; line-height: 1.5; color: var(--ink-2); margin: 12px 0 0; text-wrap: pretty; }\n  .card__role { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 5px 0 0; }\n  .card--accent-con { border-top: 3px solid var(--con); }\n  .card--accent-gen { border-top: 3px solid var(--gen); }\n  .card--accent-ctl { border-top: 3px solid var(--ctl); }\n  .role-con { color: var(--con-ink); } .role-gen { color: var(--gen-ink); } .role-ctl { color: var(--ctl-ink); }\n\n  /* ---- code ---- */\n  .code {\n    font-family: var(--font-mono); font-size: 14px; line-height: 1.65;\n    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;\n    padding: 22px 24px; white-space: pre; overflow-x: auto; color: var(--ink-2); tab-size: 2;\n  }\n  .code__cap { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }\n  .code__cap b { color: var(--signal); font-weight: 500; }\n  .k { color: var(--ctl-ink); } .s { color: var(--gen-ink); } .c { color: var(--ink-3); font-style: italic; } .f { color: var(--ink); font-weight: 600; } .n { color: var(--con-ink); } .self { color: var(--con-ink); font-style: italic; }\n\n  /* ---- terminal ---- */\n  .term { font-family: var(--font-mono); font-size: 15px; line-height: 1.7; background: #14110c; border: 1px solid #2c271d; border-radius: 4px; padding: 24px 26px; white-space: pre; overflow-x: auto; color: #d8cdb4; }\n  .term .pr { color: #6f6450; } .term .w { color: #f4ecd8; } .term .dim { color: #8a7e66; } .term .str { color: #d99a63; }\n  .term .grn { color: #8fc05a; } .term .amb { color: #e3b34e; } .term .red { color: #e0796a; } .term .blu { color: #7fa9d6; }\n\n  /* ---- verdict pills ---- */\n  .vpill { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-mono); font-weight: 500; font-size: 13px; letter-spacing: 0.04em; padding: 6px 13px; border-radius: 2px; border: 1px solid; }\n  .vpill .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }\n  .v-go { color: var(--signal-green); border-color: color-mix(in oklch, var(--signal-green) 45%, var(--rule)); }\n  .v-modify { color: var(--gen-ink); border-color: color-mix(in oklch, var(--gen) 45%, var(--rule)); }\n  .v-stop { color: var(--con-ink); border-color: color-mix(in oklch, var(--con) 45%, var(--rule)); }\n  .v-block { color: var(--signal-red); border-color: color-mix(in oklch, var(--signal-red) 50%, var(--rule)); }\n  .v-escalate { color: var(--ctl-ink); border-color: color-mix(in oklch, var(--ctl) 45%, var(--rule)); }\n\n  /* ---- chips / flow ---- */\n  .chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; padding: 5px 11px; border-radius: 2px; border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink-2); }\n  .flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }\n  .flow__node { flex: 1; min-width: 150px; border: 1px solid var(--rule); background: var(--paper); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }\n  .flow__arrow { display: flex; align-items: center; justify-content: center; padding: 0 12px; color: var(--ink-3); font-family: var(--font-mono); }\n  .flow__label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }\n  .flow__title { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }\n\n  /* ---- key-value list ---- */\n  .kv { border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); overflow: hidden; }\n  .kv__row { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 14px 20px; border-bottom: 1px solid var(--rule); align-items: baseline; }\n  .kv__row:last-child { border-bottom: 0; }\n  .kv__row:nth-child(even) { background: color-mix(in oklch, var(--paper-2) 50%, var(--paper)); }\n  .kv__k { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }\n  .kv__v { font-size: 15px; color: var(--ink-2); }\n  @media (max-width: 640px) { .kv__row { grid-template-columns: 1fr; gap: 4px; } }\n\n  /* ---- callout ---- */\n  .callout { display: flex; gap: 18px; padding: 22px 26px; background: var(--signal-soft); border-left: 3px solid var(--signal); border-radius: 0 4px 4px 0; }\n  .callout__tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--signal); font-weight: 500; flex: none; padding-top: 3px; }\n  .callout p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink-2); }\n  .callout p strong { color: var(--ink); }\n\n  /* ---- footer ---- */\n  .foot { padding: 40px 0 64px; border-top: 1px solid var(--rule); }\n  .foot__row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }\n  .foot__refs { margin-left: auto; display: flex; gap: 18px; flex-wrap: wrap; }\n\n  /* ---- reveal: no-op (content always visible; kept for hook compatibility) ---- */\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<header class=\"topbar\">\n  <div class=\"topbar__brand\">\n    <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\">\n      <circle cx=\"12\" cy=\"12\" r=\"10.5\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle>\n      <circle cx=\"8.5\" cy=\"10\" r=\"2\" fill=\"var(--con)\"><\u002Fcircle>\n      <circle cx=\"15.5\" cy=\"10\" r=\"2\" fill=\"var(--gen)\"><\u002Fcircle>\n      <circle cx=\"12\" cy=\"15.5\" r=\"2\" fill=\"var(--ctl)\"><\u002Fcircle>\n    <\u002Fsvg>\n    <span>consilium-py<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"topbar__actions\">\n    <a class=\"btn-link\" href=\"#install\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m4 17 6-6-6-6\"><\u002Fpath><path d=\"M12 19h8\"><\u002Fpath><\u002Fsvg>\n      pip install\n    <\u002Fa>\n    <a class=\"btn-link\" href=\"https://github.com/alxmax/Consilium\" target=\"_blank\" rel=\"noopener\">\n      <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.66-.22.66-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.16.58.67.48A10 10 0 0 0 22 12c0-5.52-4.48-10-10-10z\"><\u002Fpath><\u002Fsvg>\n      Repository\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<nav class=\"navbar\" id=\"navbar\"><\u002Fnav>\n\n<div class=\"page\">\n\n  <!-- ============ HERO ============ -->\n  <section class=\"hero\">\n    <div class=\"container\">\n      <div class=\"hero__meta reveal\"><span class=\"hero__dot\"><\u002Fspan> Python package · A field guide for developers<\u002Fdiv>\n      <h1 class=\"h-display reveal\">A second opinion,<br>structured.<\u002Fh1>\n      <p class=\"lede reveal\">consilium-py runs every risky code change past three independent voices — a risk assessor, an idea generator, and an auditor — then a deterministic referee turns their answers into one verdict you can act on: <strong style=\"color:var(--ink);\">GO<\u002Fstrong>, <strong style=\"color:var(--ink);\">MODIFY<\u002Fstrong>, <strong style=\"color:var(--ink);\">STOP<\u002Fstrong>, <strong style=\"color:var(--ink);\">BLOCK<\u002Fstrong>, or <strong style=\"color:var(--ink);\">ESCALATE<\u002Fstrong>.<\u002Fp>\n      <div class=\"hero__cmd reveal\"><span class=\"pr\">$<\u002Fspan>consilium deliberate <span class=\"str\">\"Add Redis caching to the API\"<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 01 · PREMISE ============ -->\n  <section class=\"section section--inked\" id=\"premise\" data-screen-label=\"Premise\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">01<\u002Fspan> · The premise<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"max-width:900px;\">One model gives you one confident opinion. That is the problem.<\u002Fh2>\n      <p class=\"lede\">Ask an LLM \"is this change OK?\" and it almost always says yes — fluently, with no sense of what could go wrong, no alternative, and no honest \"I'm not sure.\" For a throwaway script that's fine. For a migration, an API break, or a payment path, it's a trap.<\u002Fp>\n      <div class=\"grid-2 mt-40\">\n        <div class=\"card reveal\">\n          <h3>Asking one model<\u002Fh3>\n          <p>A single voice, optimised to be agreeable. It rarely surfaces the risk, the rollback, or its own uncertainty — and you can't gate a pipeline on a vibe.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card reveal\" style=\"border-color: var(--signal);\">\n          <h3>Running a consilium<\u002Fh3>\n          <p>Several voices with <strong style=\"color:var(--paper);\">different mandates<\u002Fstrong> argue it out; a deterministic referee combines them into a <span class=\"mono signal\">verdict + confidence<\u002Fspan>, with every voice's reasoning attached.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 · IN 30 SECONDS ============ -->\n  <section class=\"section\" id=\"demo\" data-screen-label=\"In 30 seconds\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">02<\u002Fspan> · The whole thing in 30 seconds<\u002Fdiv>\n      <h2 class=\"h-section\">You hand it a proposal. It hands you a verdict.<\u002Fh2>\n      <p class=\"lede\">Everything in this guide is just detail underneath this one move.<\u002Fp>\n      <div class=\"split mt-40\">\n        <div class=\"reveal\">\n          <div class=\"term\"><span class=\"pr\">$<\u002Fspan> <span class=\"w\">consilium deliberate<\u002Fspan> <span class=\"str\">\"Add Redis caching to the API\"<\u002Fspan> <span class=\"dim\">\\<\u002Fspan>\n      <span class=\"blu\">--context<\u002Fspan> src/api.py\n\n<span class=\"dim\">Verdict:    <\u002Fspan><span class=\"grn\">GO<\u002Fspan>\n<span class=\"dim\">Confidence: <\u002Fspan><span class=\"w\">0.95<\u002Fspan>\n<span class=\"dim\">Mode:       <\u002Fspan><span class=\"w\">sequential<\u002Fspan>\n\n<span class=\"dim\">Deliberation completed without anomalies.<\u002Fspan>\n<span class=\"dim\">chosen: <\u002Fspan><span class=\"amb\">cache-aside<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <p class=\"h-sub\">Five possible verdicts<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 24px;\">\n            <span class=\"vpill v-go\"><span class=\"dot\"><\u002Fspan>GO<\u002Fspan>\n            <span class=\"vpill v-modify\"><span class=\"dot\"><\u002Fspan>MODIFY<\u002Fspan>\n            <span class=\"vpill v-stop\"><span class=\"dot\"><\u002Fspan>STOP<\u002Fspan>\n            <span class=\"vpill v-block\"><span class=\"dot\"><\u002Fspan>BLOCK<\u002Fspan>\n            <span class=\"vpill v-escalate\"><span class=\"dot\"><\u002Fspan>ESCALATE<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"prose\">\n            <p>…each with a <span class=\"mono\">confidence<\u002Fspan> from <span class=\"mono\">0.0<\u002Fspan> to <span class=\"mono\">1.0<\u002Fspan>.<\u002Fp>\n            <p>Same engine, two front doors: the <span class=\"mono\">consilium<\u002Fspan> CLI, and a Python <span class=\"mono\">deliberate()<\u002Fspan> function you can <span class=\"mono\">import<\u002Fspan> into any script, test, or CI job.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 · LLM CALL ============ -->\n  <section class=\"section section--tinted\" id=\"llm\" data-screen-label=\"LLM call\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">03<\u002Fspan> · The atom — one LLM call<\u002Fdiv>\n      <h2 class=\"h-section\">A \"voice\" is one call to a model.<\u002Fh2>\n      <p class=\"lede\">Before the council makes sense, one mechanic: an LLM (a large language model, like Claude) is a text-in, text-out service. You send a <em>system prompt<\u002Fem> — its job — plus a <em>message<\u002Fem> — the task. It sends back text. One network request: an <strong style=\"color:var(--ink);\">API call<\u002Fstrong>.<\u002Fp>\n      <div class=\"split split--code mt-40\">\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>voices.py<\u002Fb> · call_voice()<\u002Fdiv><span class=\"k\">def<\u002Fspan> <span class=\"f\">call_voice<\u002Fspan>(name, system_prompt, user_msg, model):\n    response = client.messages.<span class=\"f\">create<\u002Fspan>(\n        model=model,\n        system=system_prompt,    <span class=\"c\"># the voice's job<\u002Fspan>\n        messages=[{<span class=\"s\">\"role\"<\u002Fspan>: <span class=\"s\">\"user\"<\u002Fspan>,\n                   <span class=\"s\">\"content\"<\u002Fspan>: user_msg}],\n    )\n    <span class=\"k\">return<\u002Fspan> response.content[<span class=\"n\">0<\u002Fspan>].text   <span class=\"c\"># text back<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal prose\">\n          <p class=\"h-sub\" style=\"margin-bottom:14px;\">Same function, different prompt<\u002Fp>\n          <p>Each council member is literally the <em>same<\u002Fem> <span class=\"mono\">call_voice()<\u002Fspan> with a <em>different<\u002Fem> instruction file loaded from <span class=\"mono\">prompts/voices/<\u002Fspan>. Swap the prompt, swap the personality.<\u002Fp>\n          <p>The <span class=\"mono\">anthropic<\u002Fspan> library handles the HTTP; your <span class=\"mono\">ANTHROPIC_API_KEY<\u002Fspan> proves who you are. (Section 13 shows how to point the same call at other providers.)<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 · THE VOICES ============ -->\n  <section class=\"section\" id=\"voices\" data-screen-label=\"The voices\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">04<\u002Fspan> · Meet the council<\u002Fdiv>\n      <h2 class=\"h-section\">Three voices, three mandates.<\u002Fh2>\n      <p class=\"lede\">Each is one <span class=\"mono\">call_voice()<\u002Fspan> with its own job. None decides alone — they each emit structured <span class=\"mono\">JSON<\u002Fspan> the referee will combine.<\u002Fp>\n      <div class=\"grid-3 mt-40\">\n        <div class=\"card card--accent-con reveal\">\n          <p class=\"card__role role-con\">runs 1st · risk<\u002Fp>\n          <h3>Conservator<\u002Fh3>\n          <p>\"What could go wrong, and can we undo it?\" Scores <span class=\"mono\">reversibility<\u002Fspan>, blast radius, and a <span class=\"mono\">net_concern<\u002Fspan> — and writes a concrete rollback recipe.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card card--accent-gen reveal\">\n          <p class=\"card__role role-gen\">runs 2nd · options<\u002Fp>\n          <h3>Generator<\u002Fh3>\n          <p>\"Here are the ways to do it.\" Proposes approaches with trade-offs, marks a <span class=\"mono\">preferred<\u002Fspan> one, and may <span class=\"mono\">abstain<\u002Fspan> if genuinely unsure.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card card--accent-ctl reveal\">\n          <p class=\"card__role role-ctl\">runs 3rd · audit<\u002Fp>\n          <h3>Control<\u002Fh3>\n          <p>\"Is this consistent and clearly worded?\" Flags contradictions between voices (<span class=\"mono\">disagreements<\u002Fspan>) and vague, untestable terms (<span class=\"mono\">glossary_fail<\u002Fspan>).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"callout mt-40 reveal\">\n        <span class=\"callout__tag\">Why these three<\u002Fspan>\n        <p>They map to how careful teams actually review change: someone guards against risk, someone proposes the work, someone checks it holds together. Different jobs stop them collapsing into the same agreeable \"yes\".<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 · THE PIPELINE ============ -->\n  <section class=\"section section--tinted\" id=\"pipeline\" data-screen-label=\"The pipeline\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">05<\u002Fspan> · The pipeline · sequential mode<\u002Fdiv>\n      <h2 class=\"h-section\">A relay race, not a shouting match.<\u002Fh2>\n      <p class=\"lede\">The voices run <strong style=\"color:var(--ink);\">in order<\u002Fstrong>, and each sees everything said before it. Generator reads Conservator's risk report; Control reads both. Context compounds down the line.<\u002Fp>\n      <div class=\"flow mt-40 reveal\">\n        <div class=\"flow__node\"><span class=\"flow__label\" style=\"color:var(--con-ink);\">runs 1st<\u002Fspan><span class=\"flow__title\">Conservator<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start;\">risk JSON<\u002Fspan><\u002Fdiv>\n        <div class=\"flow__arrow\">→<\u002Fdiv>\n        <div class=\"flow__node\"><span class=\"flow__label\" style=\"color:var(--gen-ink);\">runs 2nd<\u002Fspan><span class=\"flow__title\">Generator<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start;\">+ options JSON<\u002Fspan><\u002Fdiv>\n        <div class=\"flow__arrow\">→<\u002Fdiv>\n        <div class=\"flow__node\"><span class=\"flow__label\" style=\"color:var(--ctl-ink);\">runs 3rd<\u002Fspan><span class=\"flow__title\">Control<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start;\">+ audit JSON<\u002Fspan><\u002Fdiv>\n        <div class=\"flow__arrow\">→<\u002Fdiv>\n        <div class=\"flow__node\" style=\"border-color:var(--signal);\"><span class=\"flow__label\" style=\"color:var(--signal);\">deterministic<\u002Fspan><span class=\"flow__title\">Aggregator<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start; border-color:var(--signal); color:var(--signal);\">verdict<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"code mt-40 reveal\"><div class=\"code__cap\"><b>modes/sequential.py<\u002Fb> · each message carries the previous output<\u002Fdiv>cons_out = <span class=\"f\">call_voice<\u002Fspan>(<span class=\"s\">\"conservator\"<\u002Fspan>, load_prompt(<span class=\"s\">\"conservator\"<\u002Fspan>), proposal_msg, model)\n\ngen_msg  = <span class=\"s\">f\"{proposal_msg}\\n\\n--- CONSERVATOR OUTPUT ---\\n{cons_out}\"<\u002Fspan>\ngen_out  = <span class=\"f\">call_voice<\u002Fspan>(<span class=\"s\">\"generator\"<\u002Fspan>,  load_prompt(<span class=\"s\">\"generator\"<\u002Fspan>),  gen_msg, model)\n\nctrl_msg = <span class=\"s\">f\"{gen_msg}\\n\\n--- GENERATOR OUTPUT ---\\n{gen_out}\"<\u002Fspan>\nctrl_out = <span class=\"f\">call_voice<\u002Fspan>(<span class=\"s\">\"control\"<\u002Fspan>,    load_prompt(<span class=\"s\">\"control\"<\u002Fspan>),    ctrl_msg, model)\n\n<span class=\"k\">return<\u002Fspan> <span class=\"f\">aggregate_sequential<\u002Fspan>(cons_out, gen_out, ctrl_out, inp)<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 06 · THE AGGREGATOR ============ -->\n  <section class=\"section\" id=\"aggregator\" data-screen-label=\"The referee\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">06<\u002Fspan> · The referee<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"max-width:880px;\">The referee is plain Python — <span class=\"signal\">not<\u002Fspan> an AI.<\u002Fh2>\n      <p class=\"lede\">This is the most important idea in the codebase. The voices are creative and fuzzy. The <strong style=\"color:var(--ink);\">aggregator<\u002Fstrong> that turns their answers into a verdict is the opposite: fixed, readable rules. Same inputs → same verdict, every time. That's what makes it safe to gate CI on.<\u002Fp>\n      <div class=\"split split--code mt-40\">\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>aggregator.py<\u002Fb> · deterministic gates, checked in order<\u002Fdiv><span class=\"k\">if<\u002Fspan> control_out.<span class=\"f\">get<\u002Fspan>(<span class=\"s\">\"glossary_fail\"<\u002Fspan>):\n    <span class=\"k\">return<\u002Fspan> <span class=\"s\">\"BLOCK\"<\u002Fspan>       <span class=\"c\"># too vague → stop<\u002Fspan>\n\n<span class=\"k\">if<\u002Fspan> <span class=\"f\">_any_irreversibility_flag<\u002Fspan>(conservator_out):\n    <span class=\"k\">return<\u002Fspan> <span class=\"s\">\"BLOCK\"<\u002Fspan>       <span class=\"c\"># irreversible, no consent<\u002Fspan>\n\n<span class=\"k\">if<\u002Fspan> <span class=\"f\">len<\u002Fspan>(triggers) &gt;= <span class=\"n\">3<\u002Fspan>:\n    <span class=\"k\">return<\u002Fspan> <span class=\"s\">\"ESCALATE\"<\u002Fspan>    <span class=\"c\"># too many flags → a human<\u002Fspan>\n\n<span class=\"k\">if<\u002Fspan> <span class=\"s\">\"substantial_disagreement\"<\u002Fspan> <span class=\"k\">in<\u002Fspan> triggers:\n    <span class=\"k\">return<\u002Fspan> <span class=\"s\">\"REWORK\"<\u002Fspan>      <span class=\"c\"># voices clash → MODIFY<\u002Fspan>\n\n<span class=\"c\"># else: score each option, compute confidence<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <div class=\"callout\" style=\"margin-bottom:22px;\">\n            <span class=\"callout__tag\">The split<\u002Fspan>\n            <p>The AI is good at <strong>judgement<\u002Fstrong>; deterministic code is good at <strong>decisions you can audit<\u002Fstrong>. Consilium uses each for exactly what it's best at.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"prose\">\n            <p><strong>What it does, step by step:<\u002Fstrong><\u002Fp>\n            <p>1 · Reads the <span class=\"mono\">JSON<\u002Fspan> each voice returned.<br>2 · Counts \"triggers\" — concrete warning signals.<br>3 · Walks the gates above, top to bottom.<br>4 · Otherwise scores each option and computes a <span class=\"mono\">confidence<\u002Fspan>.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 07 · VERDICTS + REPORT ============ -->\n  <section class=\"section section--tinted\" id=\"report\" data-screen-label=\"Verdicts and Report\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">07<\u002Fspan> · The output<\u002Fdiv>\n      <h2 class=\"h-section\">Five verdicts, and a typed Report.<\u002Fh2>\n      <p class=\"lede\">Whatever the mode, deliberation always ends in the same shape — so you can branch on it in code without parsing prose.<\u002Fp>\n      <div class=\"split mt-40\">\n        <div class=\"reveal\">\n          <div class=\"kv\">\n            <div class=\"kv__row\"><span class=\"kv__k\"><span class=\"vpill v-go\"><span class=\"dot\"><\u002Fspan>GO<\u002Fspan><\u002Fspan><span class=\"kv__v\">Safe enough — proceed.<\u002Fspan><\u002Fdiv>\n            <div class=\"kv__row\"><span class=\"kv__k\"><span class=\"vpill v-modify\"><span class=\"dot\"><\u002Fspan>MODIFY<\u002Fspan><\u002Fspan><span class=\"kv__v\">Workable, but change something first.<\u002Fspan><\u002Fdiv>\n            <div class=\"kv__row\"><span class=\"kv__k\"><span class=\"vpill v-stop\"><span class=\"dot\"><\u002Fspan>STOP<\u002Fspan><\u002Fspan><span class=\"kv__v\">Don't do it as proposed.<\u002Fspan><\u002Fdiv>\n            <div class=\"kv__row\"><span class=\"kv__k\"><span class=\"vpill v-block\"><span class=\"dot\"><\u002Fspan>BLOCK<\u002Fspan><\u002Fspan><span class=\"kv__v\">Hard gate — irreversible or too vague.<\u002Fspan><\u002Fdiv>\n            <div class=\"kv__row\"><span class=\"kv__k\"><span class=\"vpill v-escalate\"><span class=\"dot\"><\u002Fspan>ESCALATE<\u002Fspan><\u002Fspan><span class=\"kv__v\">Too many signals at once — ask a human.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>models.py<\u002Fb> · a Pydantic model = a typed, validated shape<\u002Fdiv><span class=\"k\">class<\u002Fspan> <span class=\"f\">Report<\u002Fspan>(BaseModel):\n    verdict: Literal[<span class=\"s\">\"GO\"<\u002Fspan>, <span class=\"s\">\"MODIFY\"<\u002Fspan>, <span class=\"s\">\"STOP\"<\u002Fspan>,\n                     <span class=\"s\">\"BLOCK\"<\u002Fspan>, <span class=\"s\">\"ESCALATE\"<\u002Fspan>]\n    confidence: <span class=\"f\">float<\u002Fspan>             <span class=\"c\"># 0.0 – 1.0<\u002Fspan>\n    recommendation: <span class=\"f\">str<\u002Fspan>\n    voices: <span class=\"f\">list<\u002Fspan>[VoiceOutput]     <span class=\"c\"># every vote<\u002Fspan>\n    mode: <span class=\"f\">str<\u002Fspan> = <span class=\"s\">\"sequential\"<\u002Fspan><\u002Fdiv>\n          <div class=\"prose\" style=\"margin-top:20px;\">\n            <p><strong>Pydantic<\u002Fstrong> guarantees that shape: a verdict can only ever be one of those five strings, and <span class=\"mono\">confidence<\u002Fspan> must be a number — or the program errors loudly instead of handing you junk downstream.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 08 · WORKED EXAMPLE ============ -->\n  <section class=\"section\" id=\"example\" data-screen-label=\"Worked example\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">08<\u002Fspan> · One proposal, end to end<\u002Fdiv>\n      <h2 class=\"h-section\">\"Add Redis caching to the API.\"<\u002Fh2>\n      <p class=\"lede\">Watch the same proposal move through the council in sequential mode — what each voice contributes, and how the referee lands on a verdict.<\u002Fp>\n\n      <div class=\"mt-40\" style=\"display:flex; flex-direction:column; gap:14px;\">\n        <div class=\"card reveal\" style=\"border-left:3px solid var(--ink); border-radius:0 4px 4px 0;\">\n          <p class=\"card__role\" style=\"color:var(--ink-3);\">Input · the proposal<\u002Fp>\n          <p style=\"color:var(--ink); font-size:18px; margin-top:8px;\"><span class=\"mono\">\"Add Redis caching to the API\"<\u002Fspan> &nbsp;+&nbsp; <span class=\"mono\">--context src/api.py<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card reveal card--accent-con\">\n          <p class=\"card__role role-con\">Step 1 · Conservator — risk<\u002Fp>\n          <p style=\"color:var(--ink-2); margin-top:8px;\">Reversible (you can pull the cache out), moderate blast radius. Sets <span class=\"mono\">net_concern ≈ 0.3<\u002Fspan>, <span class=\"mono\">irreversibility_flag: false<\u002Fspan>, and writes a 3-step rollback recipe. No veto.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card reveal card--accent-gen\">\n          <p class=\"card__role role-gen\">Step 2 · Generator — options<\u002Fp>\n          <p style=\"color:var(--ink-2); margin-top:8px;\">Proposes <span class=\"mono\">cache-aside<\u002Fspan> (read-through with TTL) vs <span class=\"mono\">write-through<\u002Fspan>. Marks <span class=\"mono\">preferred: \"cache-aside\"<\u002Fspan> — simplest, easy to reason about. Does not abstain.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card reveal card--accent-ctl\">\n          <p class=\"card__role role-ctl\">Step 3 · Control — audit<\u002Fp>\n          <p style=\"color:var(--ink-2); margin-top:8px;\"><span class=\"mono\">glossary_fail: false<\u002Fspan> — wording is concrete. One minor, non-substantial disagreement noted. Nothing that blocks.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"card reveal\" style=\"border-left:3px solid var(--signal); border-radius:0 4px 4px 0; background:var(--signal-soft);\">\n          <p class=\"card__role\" style=\"color:var(--signal);\">Step 4 · Aggregator — the referee decides<\u002Fp>\n          <p style=\"color:var(--ink-2); margin-top:8px;\">No glossary fail, no irreversibility flag, fewer than 3 triggers, no substantial disagreement → falls through to <span class=\"mono\">AGGREGATE<\u002Fspan>. One minor disagreement trims methodology confidence to <span class=\"mono\">0.95<\u002Fspan>. Above <span class=\"mono\">0.70<\u002Fspan> →<\u002Fp>\n          <div style=\"display:flex; align-items:center; gap:16px; margin-top:18px; flex-wrap:wrap;\">\n            <span class=\"vpill v-go\" style=\"font-size:15px;\"><span class=\"dot\"><\u002Fspan>GO<\u002Fspan>\n            <span class=\"mono\" style=\"font-size:15px; color:var(--ink-2);\">confidence 0.95 · chosen: cache-aside<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 09 · FOUR MODES ============ -->\n  <section class=\"section section--tinted\" id=\"modes\" data-screen-label=\"Four modes\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">09<\u002Fspan> · Modes<\u002Fdiv>\n      <h2 class=\"h-section\">Same voices, four ways to run them.<\u002Fh2>\n      <p class=\"lede\">The mode decides <em>how<\u002Fem> the council deliberates. All four end in the same <span class=\"mono\">Report<\u002Fspan>; you pick one with <span class=\"mono\">--mode<\u002Fspan> (CLI) or <span class=\"mono\">mode=<\u002Fspan> (Python).<\u002Fp>\n      <div class=\"grid-2 mt-40\">\n        <div class=\"card reveal\">\n          <p class=\"card__role\" style=\"color:var(--ink-3);\">default<\u002Fp>\n          <h3>sequential<\u002Fh3>\n          <p>The relay from section 05: Conservator → Generator → Control → referee. Fast, cheap, the baseline everything else builds on.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card reveal\">\n          <p class=\"card__role\" style=\"color:var(--ink-3);\">+ adversary<\u002Fp>\n          <h3>dialectic<\u002Fh3>\n          <p>Runs sequential, then adds a <strong>Skeptic<\u002Fstrong> that attacks the chosen approach for failure modes. With <span class=\"mono\">--skeptic-can-override<\u002Fspan> it can downgrade the verdict.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card reveal\">\n          <p class=\"card__role\" style=\"color:var(--ink-3);\">+ vote<\u002Fp>\n          <h3>trias<\u002Fh3>\n          <p>Three personalities — <span class=\"mono\">Pioneer<\u002Fspan>, <span class=\"mono\">Architect<\u002Fspan>, <span class=\"mono\">Steward<\u002Fspan> — each run a full deliberation <em>in parallel<\u002Fem>, then vote. A 3-0 vote is high confidence; a 1-1-1 split escalates.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card reveal\">\n          <p class=\"card__role\" style=\"color:var(--ink-3);\">+ orchestration<\u002Fp>\n          <h3>langgraph<\u002Fh3>\n          <p>The exact same pipeline, expressed as a <strong>graph<\u002Fstrong> of nodes and edges instead of straight-line code. Section 10.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 10 · LANGGRAPH ============ -->\n  <section class=\"section\" id=\"langgraph\" data-screen-label=\"LangGraph\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">10<\u002Fspan> · Concept · LangGraph<\u002Fdiv>\n      <h2 class=\"h-section\">The pipeline, drawn as a graph.<\u002Fh2>\n      <p class=\"lede\"><strong style=\"color:var(--ink);\">LangGraph<\u002Fstrong> is a library for wiring LLM steps together as a <em>state graph<\u002Fem>: each step is a <span class=\"mono\">node<\u002Fspan>, and <span class=\"mono\">edges<\u002Fspan> say what runs next. A shared <span class=\"mono\">state<\u002Fspan> object is passed along and updated. Same Conservator → Generator → Control flow — just declared as structure.<\u002Fp>\n      <div class=\"split split--code mt-40\">\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>modes/langgraph_mode.py<\u002Fb> · nodes + edges<\u002Fdiv>g = <span class=\"f\">StateGraph<\u002Fspan>(DeliberationState)\ng.<span class=\"f\">add_node<\u002Fspan>(<span class=\"s\">\"conservator_node\"<\u002Fspan>, _conservator_node)\ng.<span class=\"f\">add_node<\u002Fspan>(<span class=\"s\">\"generator_node\"<\u002Fspan>,   _generator_node)\ng.<span class=\"f\">add_node<\u002Fspan>(<span class=\"s\">\"control_node\"<\u002Fspan>,     _control_node)\n\ng.<span class=\"f\">set_entry_point<\u002Fspan>(<span class=\"s\">\"conservator_node\"<\u002Fspan>)\ng.<span class=\"f\">add_edge<\u002Fspan>(<span class=\"s\">\"conservator_node\"<\u002Fspan>, <span class=\"s\">\"generator_node\"<\u002Fspan>)\ng.<span class=\"f\">add_edge<\u002Fspan>(<span class=\"s\">\"generator_node\"<\u002Fspan>,   <span class=\"s\">\"control_node\"<\u002Fspan>)\ng.<span class=\"f\">add_edge<\u002Fspan>(<span class=\"s\">\"control_node\"<\u002Fspan>,     END)<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal prose\">\n          <p class=\"h-sub\" style=\"margin-bottom:14px;\">Why bother, if it's the same flow?<\u002Fp>\n          <p>A graph is easier to <em>grow<\u002Fem>. The code comments point at the payoff: stream each node's output as it finishes, or add a <strong>human-in-the-loop<\u002Fstrong> pause after Conservator with a checkpointer, then resume.<\u002Fp>\n          <p>It's an <span class=\"mono\">optional<\u002Fspan> extra: <span class=\"mono\">pip install 'consilium-py[langgraph]'<\u002Fspan>. Skip it and the other three modes work unchanged.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 11 · RAG ============ -->\n  <section class=\"section section--tinted\" id=\"rag\" data-screen-label=\"RAG\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">11<\u002Fspan> · Concept · RAG<\u002Fdiv>\n      <h2 class=\"h-section\">Letting the council remember past calls.<\u002Fh2>\n      <p class=\"lede\"><strong style=\"color:var(--ink);\">RAG<\u002Fstrong> — Retrieval-Augmented Generation — means: before the voices think, fetch relevant facts and paste them into the context. Here, the \"facts\" are <em>similar decisions you've already made<\u002Fem>.<\u002Fp>\n      <div class=\"flow mt-40 reveal\">\n        <div class=\"flow__node\"><span class=\"flow__label\">1 · retrieve<\u002Fspan><span class=\"flow__title\">Find similar past runs<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start;\">top 3<\u002Fspan><\u002Fdiv>\n        <div class=\"flow__arrow\">→<\u002Fdiv>\n        <div class=\"flow__node\"><span class=\"flow__label\">2 · augment<\u002Fspan><span class=\"flow__title\">Prepend to context<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start;\">SIMILAR PAST DECISIONS<\u002Fspan><\u002Fdiv>\n        <div class=\"flow__arrow\">→<\u002Fdiv>\n        <div class=\"flow__node\"><span class=\"flow__label\">3 · deliberate<\u002Fspan><span class=\"flow__title\">Voices run as normal<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start;\">now better-informed<\u002Fspan><\u002Fdiv>\n        <div class=\"flow__arrow\">→<\u002Fdiv>\n        <div class=\"flow__node\" style=\"border-color:var(--signal);\"><span class=\"flow__label\" style=\"color:var(--signal);\">4 · save + index<\u002Fspan><span class=\"flow__title\">Store this run too<\u002Fspan><span class=\"chip\" style=\"align-self:flex-start; border-color:var(--signal); color:var(--signal);\">grows over time<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"split split--code mt-40\">\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>rag.py<\u002Fb> · the injected block<\u002Fdiv><span class=\"k\">def<\u002Fspan> <span class=\"f\">build_rag_context<\u002Fspan>(proposal):\n    snippets = <span class=\"f\">retrieve<\u002Fspan>(proposal)   <span class=\"c\"># nearest past runs<\u002Fspan>\n    <span class=\"k\">if<\u002Fspan> <span class=\"k\">not<\u002Fspan> snippets:\n        <span class=\"k\">return<\u002Fspan> <span class=\"s\">\"\"<\u002Fspan>\n    <span class=\"k\">return<\u002Fspan> <span class=\"s\">\"SIMILAR PAST DECISIONS:\\n\"<\u002Fspan> + ...\n\n<span class=\"c\"># [GO 0.95] 'Add Redis caching...': \"chose cache-aside\"<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal prose\">\n          <p>Turn it on with <span class=\"mono\">--rag<\u002Fspan>. Each finished run is saved to <span class=\"mono\">~/.consilium/runs/<\u002Fspan> and indexed, so the more you use it, the more institutional memory it carries.<\u002Fp>\n          <p>It's an opt-in extra (<span class=\"mono\">consilium-py[rag]<\u002Fspan>). If the index is empty, it prints a hint and proceeds with no past context — never silently.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 12 · EMBEDDINGS ============ -->\n  <section class=\"section\" id=\"embeddings\" data-screen-label=\"Embeddings\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">12<\u002Fspan> · Concept · embeddings &amp; vector search<\u002Fdiv>\n      <h2 class=\"h-section\">How it knows what counts as \"similar\".<\u002Fh2>\n      <p class=\"lede\">Computers can't compare meaning directly. An <strong style=\"color:var(--ink);\">embedding<\u002Fstrong> turns a sentence into a list of numbers — a point in space — so that sentences with close meanings sit close together. \"Similar\" becomes \"nearby\".<\u002Fp>\n      <div class=\"split mt-40\">\n        <div class=\"reveal prose\">\n          <p class=\"h-sub\" style=\"margin-bottom:14px;\">The three moving parts<\u002Fp>\n          <p><strong>1 · Embed.<\u002Fstrong> Each proposal's text → a vector, via a small local model (<span class=\"mono\">all-MiniLM-L6-v2<\u002Fspan>). No API call needed.<\u002Fp>\n          <p><strong>2 · Store.<\u002Fstrong> Vectors live in a <strong>vector database<\u002Fstrong> — here <span class=\"mono\">ChromaDB<\u002Fspan>, on disk at <span class=\"mono\">~/.consilium/chroma/<\u002Fspan>.<\u002Fp>\n          <p><strong>3 · Search.<\u002Fstrong> A new proposal is embedded too, then Chroma returns the nearest stored vectors by <em>distance<\u002Fem>.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>rag.py<\u002Fb> · nearest neighbours, with a cutoff<\u002Fdiv><span class=\"n\">_MAX_DISTANCE<\u002Fspan> = <span class=\"n\">0.35<\u002Fspan>   <span class=\"c\"># closer = more similar<\u002Fspan>\n<span class=\"n\">_TOP_K<\u002Fspan> = <span class=\"n\">3<\u002Fspan>\n\nresults = col.<span class=\"f\">query<\u002Fspan>(\n    query_texts=[proposal],\n    n_results=<span class=\"n\">3<\u002Fspan>,\n)\n<span class=\"c\"># keep only hits within _MAX_DISTANCE —<\u002Fspan>\n<span class=\"c\"># a loose match is worse than none<\u002Fspan><\u002Fdiv>\n          <div class=\"callout\" style=\"margin-top:22px;\">\n            <span class=\"callout__tag\">Key idea<\u002Fspan>\n            <p>Only runs <strong>within<\u002Fstrong> the distance cutoff are used. Better to give the voices nothing than to feed them a vaguely-related decision.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 13 · LITELLM ============ -->\n  <section class=\"section section--tinted\" id=\"litellm\" data-screen-label=\"LiteLLM\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">13<\u002Fspan> · Concept · LiteLLM<\u002Fdiv>\n      <h2 class=\"h-section\">Same council, any model provider.<\u002Fh2>\n      <p class=\"lede\"><strong style=\"color:var(--ink);\">LiteLLM<\u002Fstrong> is a thin adapter that speaks one API to many providers — OpenAI, Anthropic, local models, and more. Consilium uses it so you aren't locked to one vendor.<\u002Fp>\n      <div class=\"split split--code mt-40\">\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>voices.py<\u002Fb> · the \"/\" decides the route<\u002Fdiv><span class=\"k\">def<\u002Fspan> <span class=\"f\">call_voice<\u002Fspan>(name, system_prompt, user_msg, model):\n    <span class=\"k\">if<\u002Fspan> <span class=\"s\">\"/\"<\u002Fspan> <span class=\"k\">in<\u002Fspan> model:                  <span class=\"c\"># e.g. \"openai/gpt-4o\"<\u002Fspan>\n        <span class=\"k\">import<\u002Fspan> litellm\n        <span class=\"k\">return<\u002Fspan> litellm.<span class=\"f\">completion<\u002Fspan>(model=model, ...)\n    <span class=\"c\"># otherwise: native Anthropic client<\u002Fspan>\n    <span class=\"k\">return<\u002Fspan> _get_client().messages.<span class=\"f\">create<\u002Fspan>(...)<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal prose\">\n          <p class=\"h-sub\" style=\"margin-bottom:14px;\">One rule to remember<\u002Fp>\n          <p>A plain model name (<span class=\"mono\">claude-sonnet-4-6<\u002Fspan>) uses the native client. A <span class=\"mono\">provider/model<\u002Fspan> string (<span class=\"mono\">openai/gpt-4o<\u002Fspan>) routes through LiteLLM.<\u002Fp>\n          <p>Set it per call with <span class=\"mono\">--model<\u002Fspan>, or globally with the <span class=\"mono\">CONSILIUM_MODEL<\u002Fspan> environment variable — which overrides everything before any voice runs. Opt-in extra: <span class=\"mono\">consilium-py[litellm]<\u002Fspan>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 14 · FASTAPI ============ -->\n  <section class=\"section\" id=\"fastapi\" data-screen-label=\"FastAPI\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">14<\u002Fspan> · Concept · FastAPI<\u002Fdiv>\n      <h2 class=\"h-section\">Turning the engine into a web service.<\u002Fh2>\n      <p class=\"lede\"><strong style=\"color:var(--ink);\">FastAPI<\u002Fstrong> is a Python framework for building web APIs: you write a function, decorate it with a route, and it becomes an HTTP endpoint other programs can call over the network.<\u002Fp>\n      <div class=\"callout reveal\" style=\"margin-bottom:34px;\">\n        <span class=\"callout__tag\">Status · planned<\u002Fspan>\n        <p><strong>This isn't built yet.<\u002Fstrong> FastAPI ships as a declared optional extra (<span class=\"mono\">consilium-py[server]<\u002Fspan>) — the dependency is reserved, but there's no server module in the package today. The sketch below is how it would slot in, not code that exists.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"split split--code\">\n        <div class=\"reveal\">\n          <div class=\"code\"><div class=\"code__cap\"><b>sketch<\u002Fb> · how deliberate() would become an endpoint<\u002Fdiv><span class=\"k\">from<\u002Fspan> fastapi <span class=\"k\">import<\u002Fspan> FastAPI\n<span class=\"k\">from<\u002Fspan> consilium <span class=\"k\">import<\u002Fspan> deliberate\n\napp = <span class=\"f\">FastAPI<\u002Fspan>()\n\n<span class=\"self\">@app.post(<span class=\"s\">\"/deliberate\"<\u002Fspan>)<\u002Fspan>\n<span class=\"k\">def<\u002Fspan> <span class=\"f\">run<\u002Fspan>(proposal: <span class=\"f\">str<\u002Fspan>, mode: <span class=\"f\">str<\u002Fspan> = <span class=\"s\">\"sequential\"<\u002Fspan>):\n    report = <span class=\"f\">deliberate<\u002Fspan>(proposal, mode=mode)\n    <span class=\"k\">return<\u002Fspan> report.<span class=\"f\">model_dump<\u002Fspan>()   <span class=\"c\"># JSON out<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"reveal prose\">\n          <p class=\"h-sub\" style=\"margin-bottom:14px;\">Why it fits so cleanly<\u002Fp>\n          <p>The whole engine is already one function that returns a typed <span class=\"mono\">Report<\u002Fspan>. A Pydantic model converts straight to JSON with <span class=\"mono\">.model_dump()<\u002Fspan> — so wrapping it in an endpoint is almost no new logic.<\u002Fp>\n          <p>That would let a CI bot, an IDE plugin, or a dashboard call the council over HTTP instead of importing Python.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 15 · MENTAL MODEL ============ -->\n  <section class=\"section section--inked\" id=\"recap\" data-screen-label=\"Mental model\">\n    <div class=\"container\">\n      <div class=\"divider-num\"><span class=\"divider-num__id\">15<\u002Fspan> · The mental model<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"max-width:920px;\">If you remember one thing, remember this.<\u002Fh2>\n      <p class=\"lede\" style=\"max-width:820px;\">Fuzzy AI voices produce structured opinions; deterministic Python turns those into a verdict you can trust in a pipeline. Everything else — modes, RAG, LangGraph — is a layer on that spine.<\u002Fp>\n      <div class=\"grid-2 mt-48\">\n        <div class=\"card reveal\">\n          <h3 style=\"color:var(--paper);\">The spine<\u002Fh3>\n          <p>proposal → 3 voices (LLM calls) → JSON → deterministic aggregator → <span class=\"mono\" style=\"color:var(--paper);\">Report(verdict, confidence)<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card reveal\">\n          <h3 style=\"color:var(--paper);\">The layers<\u002Fh3>\n          <p><span class=\"mono\" style=\"color:var(--paper);\">modes<\u002Fspan> change how voices run · <span class=\"mono\" style=\"color:var(--paper);\">RAG<\u002Fspan> adds memory · <span class=\"mono\" style=\"color:var(--paper);\">LiteLLM<\u002Fspan> swaps providers · <span class=\"mono\" style=\"color:var(--paper);\">LangGraph / FastAPI<\u002Fspan> change orchestration &amp; delivery.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"install\" style=\"margin-top:48px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;\">\n        <div class=\"hero__cmd reveal\" style=\"margin-top:0;\"><span class=\"pr\">$<\u002Fspan>pip install consilium-py<\u002Fdiv>\n        <div class=\"hero__cmd reveal\" style=\"margin-top:0; background:rgba(244,236,216,0.08); color:var(--paper);\"><span class=\"pr\" style=\"color:rgba(244,236,216,0.4);\">$<\u002Fspan>export ANTHROPIC_API_KEY=<span class=\"str\">sk-ant-...<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ FOOTER ============ -->\n  <footer class=\"foot\">\n    <div class=\"container\">\n      <div class=\"foot__row\">\n        <span>consilium-py<\u002Fspan>\n        <span style=\"color:var(--rule-2);\">·<\u002Fspan>\n        <span>dialectical code-change deliberation<\u002Fspan>\n        <span class=\"foot__refs\">\n          <span>README.md<\u002Fspan>\n          <span>src/consilium/<\u002Fspan>\n          <span>prompts/voices/<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<script>\n  // ---- numbered nav (built from sections) + scroll-spy ----\n  (function () {\n    var SECTIONS = [\n      ['premise', '01', 'Premise'],\n      ['demo', '02', 'In 30s'],\n      ['llm', '03', 'LLM call'],\n      ['voices', '04', 'Voices'],\n      ['pipeline', '05', 'Pipeline'],\n      ['aggregator', '06', 'Referee'],\n      ['report', '07', 'Verdicts'],\n      ['example', '08', 'Worked example'],\n      ['modes', '09', 'Modes'],\n      ['langgraph', '10', 'LangGraph'],\n      ['rag', '11', 'RAG'],\n      ['embeddings', '12', 'Embeddings'],\n      ['litellm', '13', 'LiteLLM'],\n      ['fastapi', '14', 'FastAPI'],\n      ['recap', '15', 'Mental model']\n    ];\n    var nav = document.getElementById('navbar');\n    var chips = {};\n    SECTIONS.forEach(function (s) {\n      var a = document.createElement('a');\n      a.className = 'navchip';\n      a.href = '#' + s[0];\n      a.setAttribute('data-target', s[0]);\n      a.innerHTML = '<span class=\"navchip__id\">' + s[1] + '<\u002Fspan><span class=\"navchip__name\">' + s[2] + '<\u002Fspan>';\n      nav.appendChild(a);\n      chips[s[0]] = a;\n    });\n\n    var ids = SECTIONS.map(function (s) { return s[0]; });\n    function setActive(id) {\n      ids.forEach(function (x) { if (chips[x]) chips[x].setAttribute('data-active', String(x === id)); });\n    }\n    if ('IntersectionObserver' in window) {\n      var visible = {};\n      var io = new IntersectionObserver(function (entries) {\n        entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting ? e.intersectionRatio : 0; });\n        var best = null, bestR = 0;\n        ids.forEach(function (x) { if ((visible[x] || 0) > bestR) { bestR = visible[x]; best = x; } });\n        if (best) setActive(best);\n      }, { rootMargin: '-130px 0px -55% 0px', threshold: [0, 0.2, 0.5, 1] });\n      ids.forEach(function (x) { var el = document.getElementById(x); if (el) io.observe(el); });\n    }\n\n    // ---- reveal on scroll (enhancement; content stays visible if it never fires) ----\n    var rev = document.querySelectorAll('.reveal');\n    function showAll() { rev.forEach(function (e) { e.classList.add('in'); }); }\n    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      showAll();\n    } else {\n      var ro = new IntersectionObserver(function (entries) {\n        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); ro.unobserve(en.target); } });\n      }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });\n      rev.forEach(function (e) { ro.observe(e); });\n      // mark anything already on-screen at load, then a catch-all failsafe\n      requestAnimationFrame(function () {\n        rev.forEach(function (e) { var r = e.getBoundingClientRect(); if (r.top < window.innerHeight && r.bottom > 0) e.classList.add('in'); });\n      });\n      setTimeout(showAll, 1600);\n    }\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
