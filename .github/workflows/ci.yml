name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (supply-chain hardening) and kept current by
# Dependabot (.github/dependabot.yml). See also terraform.yml for the infra gate.

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with all extras)
        run: pip install -e ".[dev,server,rag,langgraph]"
      - name: Run tests
        run: python -m pytest -q

  gate:
    name: requirement drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Requirement traceability drift gate
        run: python scripts/reqmap.py gate
      - name: Requirement map freshness
        run: python -X utf8 scripts/reqmap.py map --check
