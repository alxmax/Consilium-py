name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (supply-chain hardening) and kept current by
# Dependabot (.github/dependabot.yml). See also terraform.yml for the infra gate.

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with all extras)
        run: pip install -e ".[dev,server,rag,langgraph]"
      - name: Run tests
        run: python -m pytest -q

  gate:
    name: requirement drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Requirement traceability drift gate
        run: python scripts/reqmap.py gate
