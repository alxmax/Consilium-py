name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (supply-chain hardening) and kept current by
# Dependabot (.github/dependabot.yml). See also terraform.yml for the infra gate.

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with all extras)
        run: pip install -e ".[dev,server,rag,langgraph,docs]"
      - name: Run tests
        run: python -m pytest -q

  gate:
    name: requirement drift gate
    runs-on: ubuntu-latest
    # The gate only reads the tree: no secrets, no write scope. Keep it that way so a
    # fork PR cannot use this job for anything.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately a @vN MAJOR ALIAS, not a SHA, unlike every other action here: the
      # point of this pin is to consume requirement-manager the way its docs tell a
      # consumer to, so a break in that published interface shows up here. The action
      # runs THIS repo's vendored scripts/reqmap.py (+ scripts/reqmap_engine/) and brings
      # its own setup-python.
      - uses: alxmax/requirement-manager/check@v8
        with:
          python-version: "3.12"
