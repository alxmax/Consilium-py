name: Terraform

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

jobs:
  # Always-green, no cloud credentials needed. Catches formatting/syntax errors.
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (validate only, no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # A plan/apply job (Workload Identity Federation + deployer service account) belongs
  # here once you actually wire up cloud deploy from CI — add it then, with the same
  # SHA-pinning discipline as above. Until it exists, `terraform apply` is a local step
  # (see infra/README.md).
