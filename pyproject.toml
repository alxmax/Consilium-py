[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consilium-py"
version = "0.1.0"
description = "Dialectical code-change deliberation as a Python package"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Schipor Alexandru", email = "schipor.alexandru123@gmail.com" }]
keywords = ["llm", "agentic", "multi-agent", "deliberation", "code-review", "rag", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "anthropic>=0.25.0",
    "litellm>=1.0",
    "tenacity>=8.0",  # litellm needs it at runtime for num_retries; not always pulled in transitively
    "click>=8.1",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/alxmax/Consilium-py"
Repository = "https://github.com/alxmax/Consilium-py"
Issues = "https://github.com/alxmax/Consilium-py/issues"

[project.optional-dependencies]
dev = ["pyright", "pytest"]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
rag = ["chromadb>=0.4,<0.6"]
langgraph = ["langgraph>=0.2,<0.3", "langchain-core>=0.2,<0.3"]

[project.scripts]
consilium = "consilium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consilium"]

[tool.pytest.ini_options]
pythonpath = ["src"]
