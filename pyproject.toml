[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consilium-py"
version = "0.1.0"
description = "Dialectical code-change deliberation as a Python package"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pyright"]
rag = ["chromadb>=0.4,<0.6"]
langgraph = ["langgraph>=0.2,<0.3", "langchain-core>=0.2,<0.3"]
litellm = ["litellm>=1.0"]

[project.scripts]
consilium = "consilium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consilium"]

[tool.pytest.ini_options]
pythonpath = ["src"]
